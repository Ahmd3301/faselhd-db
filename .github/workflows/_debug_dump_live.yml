name: _debug_dump_live

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "supabase>=2.12.0"
      - name: Dump live sections/columns
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, json
          from supabase import create_client
          c = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          secs = c.table("sections").select("*").order("key").execute().data
          print("SECTION_COUNT=", len(secs))
          for s in secs:
              print("SEC\t%s\t%s\t%s" % (s.get("key"), s.get("items_count"), s.get("name")))
          row = c.table("items").select("*").limit(1).execute().data
          print("ITEM_COLUMNS=", sorted(row[0].keys()) if row else "none")
          try:
              u = c.table("users").select("*").limit(3).execute().data
              print("USER_COLUMNS=", sorted(u[0].keys()) if u else "none")
              print("USERS=", u)
          except Exception as e:
              print("USERS_ERR=", str(e)[:160])
          try:
              r = c.rpc("search_items", {"q": "test", "sec": None, "limit_count": 1, "offset_count": 0}).execute()
              print("RPC_search_items=OK")
          except Exception as e:
              print("RPC_search_items=ERR", str(e)[:120])
          PY
