name: Test Cloudflare Bypass (hybrid method)

# Standalone experiment — does NOT touch update.py or the database.
# Goal: find out whether a GitHub Actions runner (datacenter IP) can
#       1) solve the Cloudflare Managed Challenge with a real browser, and
#       2) reuse cf_clearance + the same UA for plain HTTP scraping.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to test'
        required: false
        default: 'https://www.fasel-hd.cam/'
      browser:
        description: 'chrome (branded, recommended) or chromium (bundled)'
        required: false
        default: 'chrome'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python deps
        run: pip install patchright parsel

      - name: Install Chromium + system deps
        run: python -m patchright install --with-deps chromium

      - name: Install branded Google Chrome
        if: ${{ (github.event.inputs.browser || 'chrome') == 'chrome' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb wget
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq /tmp/chrome.deb
          google-chrome --version

      - name: Install xvfb (chromium path)
        if: ${{ (github.event.inputs.browser || 'chrome') != 'chrome' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: DNS / reachability probe (Cloudflare challenge hosts)
        if: always()
        run: |
          for h in challenges.cloudflare.com brunhild.challenges.cloudflare.com \
                   hagen.challenges.cloudflare.com www.fasel-hd.co; do
            echo "== $h"
            getent hosts "$h" || echo "  getent: NOT RESOLVED"
            dig +short "$h" 2>/dev/null || true
            curl -s -o /dev/null -w "  curl status=%{http_code} ip=%{remote_ip}\n" \
              --max-time 15 "https://$h/" || echo "  curl failed"
          done

      - name: Run bypass verification (headed under xvfb)
        env:
          CF_TARGET: ${{ github.event.inputs.target || 'https://www.fasel-hd.cam/' }}
          CF_CHANNEL: ${{ github.event.inputs.browser || 'chrome' }}
          CF_HEADLESS: '0'
          CF_SOLVE_TIMEOUT: '120'
          CF_DIAG_DIR: diag
          FASELHD_HOST_RULES: 'MAP brunhild.challenges.cloudflare.com 104.18.17.146, MAP hagen.challenges.cloudflare.com 104.18.8.208'
          FASELHD_EXTRA_ARGS: '--lang=en-US --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader'
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            python scripts/verify_cf_bypass.py 2>&1 | tee verify.log

      - name: Show runner egress IP
        if: always()
        run: |
          echo "egress IP: $(curl -s --max-time 20 https://api.ipify.org || true)"
          curl -s --max-time 20 https://ipinfo.io/json || true

      - name: Upload logs + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-bypass-${{ github.event.inputs.browser || 'chrome' }}-${{ github.run_number }}
          path: |
            verify.log
            diag/
          if-no-files-found: ignore
